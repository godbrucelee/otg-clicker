name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Build with Buildozer
        uses: ArtemSidorov/buildozer-action@v1.2
        with:
          command: buildozer -s android debug
          subfolder: .

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: otg-clicker-apk
          path: bin/*.apk
          
